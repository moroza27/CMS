<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Архітектури фон Неймана та Гарвардська</title>
  <desc id="description">Дві схеми поруч. У фон Неймана процесор і спільна пам'ять програм та даних з'єднані одним каналом, який є вузьким місцем. У Гарвардській архітектурі пам'ять команд і даних та їхні шини розділені.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#c24136"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#28745b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #202b32; }
      .panel { fill: #fbfaf6; stroke: #d7d8d1; stroke-width: 2; }
      .heading { font-size: 27px; font-weight: 700; }
      .subheading { font-size: 16px; fill: #58656a; }
      .block { fill: #e9eee9; stroke: #50665d; stroke-width: 2; }
      .memory { fill: #f1eee3; stroke: #7d7151; stroke-width: 2; }
      .block-label { font-size: 19px; font-weight: 650; text-anchor: middle; }
      .small-label { font-size: 15px; text-anchor: middle; fill: #4f5d60; }
      .bus-label { font-size: 15px; font-weight: 650; text-anchor: middle; }
      .callout { fill: #fae9e5; stroke: #c24136; stroke-width: 2; }
      .callout-text { font-size: 16px; font-weight: 700; text-anchor: middle; fill: #9b3029; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#f0f1ec"/>
  <rect class="panel" x="20" y="20" width="565" height="580" rx="8"/>
  <rect class="panel" x="615" y="20" width="565" height="580" rx="8"/>

  <text class="heading" x="302" y="67" text-anchor="middle">Архітектура фон Неймана</text>
  <text class="subheading" x="302" y="96" text-anchor="middle">Команди й дані зберігаються разом</text>

  <rect class="block" x="55" y="218" width="190" height="150" rx="7"/>
  <text class="block-label" x="150" y="270">Процесор</text>
  <text class="small-label" x="150" y="301">пристрій керування</text>
  <text class="small-label" x="150" y="327">АЛП · регістри</text>

  <rect class="memory" x="360" y="218" width="190" height="150" rx="7"/>
  <text class="block-label" x="455" y="267">Спільна</text>
  <text class="block-label" x="455" y="292">пам'ять</text>
  <text class="small-label" x="455" y="329">програми + дані</text>

  <text class="bus-label" x="302" y="425" fill="#a33830">Єдина шина для команд і даних</text>
  <line x1="245" y1="319" x2="360" y2="319" stroke="#c24136" stroke-width="8" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <rect class="callout" x="100" y="473" width="405" height="72" rx="7"/>
  <text class="callout-text" x="302" y="503">ВУЗЬКЕ МІСЦЕ ФОН НЕЙМАНА</text>
  <text class="small-label" x="302" y="527">команди й дані конкурують за один канал</text>

  <text class="heading" x="897" y="67" text-anchor="middle">Гарвардська архітектура</text>
  <text class="subheading" x="897" y="96" text-anchor="middle">Окремі пам'ять і шини команд та даних</text>

  <rect class="block" x="665" y="250" width="190" height="150" rx="7"/>
  <text class="block-label" x="760" y="302">Процесор</text>
  <text class="small-label" x="760" y="333">пристрій керування</text>
  <text class="small-label" x="760" y="359">АЛП · регістри</text>

  <rect class="memory" x="950" y="145" width="190" height="105" rx="7"/>
  <text class="block-label" x="1045" y="185">Пам'ять</text>
  <text class="small-label" x="1045" y="215">команд</text>

  <rect class="memory" x="950" y="400" width="190" height="105" rx="7"/>
  <text class="block-label" x="1045" y="440">Пам'ять</text>
  <text class="small-label" x="1045" y="470">даних</text>

  <path d="M855 280H900V198H950" fill="none" stroke="#28745b" stroke-width="5" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <path d="M855 370H900V452H950" fill="none" stroke="#3976a8" stroke-width="5" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <text class="bus-label" x="900" y="145" fill="#28745b">Шина команд</text>
  <text class="bus-label" x="900" y="505" fill="#3976a8">Шина даних</text>
  <text class="small-label" x="897" y="560">Обидва канали можуть працювати незалежно</text>
</svg>